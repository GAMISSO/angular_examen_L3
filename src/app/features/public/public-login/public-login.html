<section class="login-layout">
    <article class="login-panel">
        <h1>Connexion</h1>

        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
            <label>
                <span>Email</span>
                <input type="email" formControlName="email" placeholder="exemple@badwallet.tn" autocomplete="email" />
            </label>

            <label>
                <span>Mot de passe</span>
                <input type="password" formControlName="password" placeholder="Mot de passe"
                    autocomplete="current-password" />
            </label>

            @if (loginForm.invalid && loginForm.touched) {
            <p class="error" role="alert">Saisissez un email valide et un mot de passe d’au moins 4 caractères.</p>
            }

            <div class="actions">
                <button class="primary" type="submit" [disabled]="submitting()">Entrer</button>
            </div>
        </form>
    </article>

    <article class="login-panel">
        <h1>Créer un compte client</h1>

        <form class="login-form" [formGroup]="createClientForm" (ngSubmit)="createClientAccount()" novalidate>
            <label>
                <span>Nom complet</span>
                <input type="text" formControlName="fullName" placeholder="Nom et prénom" autocomplete="name" />
            </label>

            <label>
                <span>Email</span>
                <input type="email" formControlName="email" placeholder="client@badwallet.tn" autocomplete="email" />
            </label>

            <label>
                <span>Téléphone</span>
                <input type="tel" formControlName="phone" placeholder="+221771234567" autocomplete="tel" />
            </label>

            <label>
                <span>Mot de passe</span>
                <input type="password" formControlName="password" placeholder="Mot de passe"
                    autocomplete="new-password" />
            </label>

            @if (createClientForm.invalid && createClientForm.touched) {
            <p class="error" role="alert">Vérifiez le nom, l’email, le téléphone et le mot de passe.</p>
            }

            <div class="actions">
                <button class="primary" type="submit" [disabled]="creatingAccount()">Créer le compte</button>
            </div>
        </form>
    </article>
</section>
